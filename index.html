<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kai Finance</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Kai Finance</h1>

    <div class="summary">
        <div class="card">
            <h3>Income</h3>
            <p id="incomeDisplay">₹0</p>
        </div>

        <div class="card">
            <h3>Expenses</h3>
            <p id="expenseDisplay">₹0</p>
        </div>

        <div class="card">
            <h3>Balance</h3>
            <p id="balanceDisplay">₹0</p>
        </div>
    </div>

    <div class="form">
        <input type="number" id="incomeInput" placeholder="Enter Income">

        <input type="text" id="expenseName" placeholder="Expense Name">

        <select id="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Education</option>
            <option>Shopping</option>
            <option>Entertainment</option>
            <option>Health</option>
            <option>Other</option>
        </select>

        <input type="number" id="expenseAmount" placeholder="Expense Amount">

        <button onclick="addIncome()">Add Income</button>
        <button onclick="addExpense()">Add Expense</button>
    </div>

    <h2>Expense History</h2>
    <ul id="expenseList"></ul>

</div>

<script src="script.js"></script>
</body>
</html>
